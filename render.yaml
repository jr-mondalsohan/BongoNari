services:
  - type: web
    name: bongonari-storefront
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: bongonari-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: HOST
        value: 0.0.0.0
      - key: BONGONARI_DATA_DIR
        value: /var/data
